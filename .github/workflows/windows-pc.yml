name: Custom Windows Virtual PC

on: 
  workflow_dispatch: # मैन्युअल रूप से चालू करने के लिए

jobs:
  deploy-virtual-machine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Initialize Environment Layout
      uses: actions/checkout@v4

    - name: Download and Configure Ngrok Binary
      run: |
        curl -s https://amazonaws.com | sudo tee /etc/keyrings/ngrok.asc >/dev/null
        echo "deb [signed-by=/etc/keyrings/ngrok.asc] https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install ngrok -y

    - name: Inject Tunnel Authentication Credentials
      run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Initialize Isolated Windows OS Container
      run: |
        # स्टोरेज डायरेक्टरी बनाना
        sudo mkdir -p /tmp/docker-data
        sudo chown -R $USER:$USER /tmp/docker-data
        
        # बिना KVM बाधा के विंडोज कंटेनर को बैकग्राउंड में रन करना
        docker run -d --name windows_instance \
          -p 8006:8006 \
          --cap-add NET_ADMIN \
          -e VERSION="10" \
          -e RAM_SIZE="6G" \
          -e CPU_CORES="2" \
          dockurr/windows

    - name: Expose Browser Interface and Keep-Alive Host
      run: |
        echo "=========================================================="
        echo "CONNECTING PROXY CONNECTION TUNNEL..."
        echo "=========================================================="
        
        # पोर्ट 8006 के लिए ngrok टनल चालू करना
        ngrok http 8006 --log=stdout &
        
        # टनल एक्टिव होने के लिए थोड़ा रुकना
        sleep 12
        
        # आपका लाइव विंडोज पीसी यूआरएल प्रिंट करना
        curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels.public_url'
        
        echo "=========================================================="
        echo "VIRTUAL PC ACTIVE. COPY THE URL ABOVE TO OPEN WINDOWS."
        echo "=========================================================="
        
        # रनर को 6 घंटे तक चालू रखना
        sleep 21600
